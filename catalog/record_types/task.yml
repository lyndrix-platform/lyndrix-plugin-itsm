# Task — a unit of work, usually a child of another record.
id: task
label: Task
prefix: TSK
number_width: 7
icon: task_alt
mode: native
description: Work item, typically linked as a child of an incident, change or problem.

subtypes: []
categories: []

priority:
  impact:
    - {id: 1, label: High}
    - {id: 2, label: Medium}
    - {id: 3, label: Low}
  urgency:
    - {id: 1, label: High}
    - {id: 2, label: Medium}
    - {id: 3, label: Low}
  defaults: {impact: 3, urgency: 3}
  matrix:
    "1-1": P1
    "1-2": P2
    "1-3": P3
    "2-1": P2
    "2-2": P3
    "2-3": P4
    "3-1": P3
    "3-2": P4
    "3-3": P4
  levels:
    - {id: P1, label: Critical, color: down}
    - {id: P2, label: High, color: down}
    - {id: P3, label: Medium, color: paused}
    - {id: P4, label: Low, color: unknown}

states:
  - {id: open, label: Open, initial: true, kind: open}
  - {id: in_progress, label: In progress, kind: open}
  - {id: done, label: Done, kind: closed, final: true}
  - {id: cancelled, label: Cancelled, kind: closed, final: true}

transitions:
  open: [in_progress, done, cancelled]
  in_progress: [done, open, cancelled]

fields:
  - {id: due, label: Due, kind: datetime}

assignment_groups:
  - {id: infra, label: Infrastructure, core_group: INT_ADMIN}
  - {id: service_desk, label: Service Desk}
