# Problem — the cause of one or more incidents.
id: problem
label: Problem
prefix: PRB
number_width: 7
icon: bug_report
mode: native
description: Root cause behind one or more incidents; tracks the known error and its fix.

subtypes:
  - {id: reactive, label: Reactive (from incidents)}
  - {id: proactive, label: Proactive (trend / risk)}

categories:
  - {id: compute, label: Compute}
  - {id: network, label: Network}
  - {id: storage, label: Storage}
  - {id: application, label: Application}
  - {id: process, label: Process}

priority:
  impact:
    - {id: 1, label: High}
    - {id: 2, label: Medium}
    - {id: 3, label: Low}
  urgency:
    - {id: 1, label: High}
    - {id: 2, label: Medium}
    - {id: 3, label: Low}
  defaults: {impact: 2, urgency: 2}
  matrix:
    "1-1": P1
    "1-2": P2
    "1-3": P3
    "2-1": P2
    "2-2": P3
    "2-3": P4
    "3-1": P3
    "3-2": P4
    "3-3": P4
  levels:
    - {id: P1, label: Critical, color: down}
    - {id: P2, label: High, color: down}
    - {id: P3, label: Medium, color: paused}
    - {id: P4, label: Low, color: unknown}

states:
  - {id: new, label: New, initial: true, kind: open}
  - {id: analysis, label: Root cause analysis, kind: open}
  - {id: known_error, label: Known error, kind: open, requires: [root_cause, workaround]}
  - {id: fix_in_progress, label: Fix in progress, kind: open}
  - {id: resolved, label: Resolved, kind: resolved, requires: [root_cause, fix_description]}
  - {id: closed, label: Closed, kind: closed, final: true}
  - {id: cancelled, label: Cancelled, kind: closed, final: true, requires: [cancel_reason]}

transitions:
  new: [analysis, cancelled]
  analysis: [known_error, fix_in_progress, resolved, cancelled]
  known_error: [fix_in_progress, resolved, cancelled]
  fix_in_progress: [resolved, known_error]
  resolved: [closed, analysis]

fields:
  - {id: root_cause, label: Root cause, kind: text, multiline: true}
  - {id: workaround, label: Workaround, kind: text, multiline: true}
  - {id: fix_description, label: Fix description, kind: text, multiline: true}
  - {id: cancel_reason, label: Cancel reason, kind: text}

assignment_groups:
  - {id: infra, label: Infrastructure, core_group: INT_ADMIN}
  - {id: application, label: Application}
