# Service request — a user asks for something that is not an incident.
id: request
label: Service request
prefix: REQ
number_width: 7
icon: support_agent
mode: native
description: Request for information, access, a new service or a standard change.

subtypes:
  - {id: access, label: Access / permissions}
  - {id: new_service, label: New service / server}
  - {id: information, label: Information}
  - {id: hardware, label: Hardware}
  - {id: other, label: Other}

categories:
  - {id: identity, label: Identity & access}
  - {id: compute, label: Compute}
  - {id: application, label: Application}
  - {id: general, label: General}

priority:
  impact:
    - {id: 1, label: High}
    - {id: 2, label: Medium}
    - {id: 3, label: Low}
  urgency:
    - {id: 1, label: High}
    - {id: 2, label: Medium}
    - {id: 3, label: Low}
  defaults: {impact: 3, urgency: 3}
  matrix:
    "1-1": P2
    "1-2": P3
    "1-3": P3
    "2-1": P3
    "2-2": P3
    "2-3": P4
    "3-1": P3
    "3-2": P4
    "3-3": P4
  levels:
    - {id: P1, label: Critical, color: down}
    - {id: P2, label: High, color: down}
    - {id: P3, label: Medium, color: paused}
    - {id: P4, label: Low, color: unknown}

states:
  - {id: new, label: New, initial: true, kind: open}
  - {id: approval, label: Awaiting approval, kind: open}
  - {id: fulfilling, label: Fulfilling, kind: open}
  - {id: on_hold, label: On hold, kind: open, requires: [hold_reason]}
  - {id: fulfilled, label: Fulfilled, kind: resolved, requires: [fulfilment_notes]}
  - {id: closed, label: Closed, kind: closed, final: true}
  - {id: rejected, label: Rejected, kind: closed, final: true, requires: [reject_reason]}

transitions:
  new: [approval, fulfilling, rejected]
  approval: [fulfilling, rejected]
  fulfilling: [on_hold, fulfilled]
  on_hold: [fulfilling, rejected]
  fulfilled: [closed, fulfilling]

fields:
  - {id: hold_reason, label: Hold reason, kind: text}
  - {id: fulfilment_notes, label: Fulfilment notes, kind: text, multiline: true}
  - {id: reject_reason, label: Reject reason, kind: text}
  - {id: requested_for, label: Requested for (user), kind: text}

assignment_groups:
  - {id: service_desk, label: Service Desk}
  - {id: infra, label: Infrastructure, core_group: INT_ADMIN}
